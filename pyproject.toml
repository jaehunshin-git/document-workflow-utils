[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "document-workflow-utils"
version = "0.2.0"
description = "파일 목록 비교와 디렉터리 분석을 위한 개인 Python 도구 모음"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
doc-utils = "document_workflow_utils.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/document_workflow_utils"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
