name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: 저장소 체크아웃
        # actions/checkout v7 메이저 태그의 최신 안정 릴리스(v7.0.1)를 커밋으로 고정합니다.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: uv 설치
        # astral-sh/setup-uv v10 메이저 태그의 최신 안정 릴리스(v10.0.1)를 커밋으로 고정합니다.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "${{ matrix.python-version }}"

      - name: 의존성 동기화
        run: uv sync --locked

      - name: 테스트 실행
        run: uv run pytest

      - name: 린트 실행
        run: uv run ruff check src tests

      - name: 패키지 빌드
        run: uv build
